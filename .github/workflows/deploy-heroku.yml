name: Deploy ProphitBet to Heroku

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heroku-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Validate Heroku configuration
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          if [ -z "$HEROKU_APP_NAME" ]; then
            echo "::error::Missing HEROKU_APP_NAME repository variable."
            exit 1
          fi

          if [ -z "$HEROKU_API_KEY" ]; then
            echo "::error::Missing HEROKU_API_KEY repository secret."
            exit 1
          fi

          echo "Target Heroku app: $HEROKU_APP_NAME"

      - name: Log in to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku container:login

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Build Docker image
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
          DOCKER_BUILDKIT: "0"
        run: |
          docker build \
            --pull \
            --platform linux/amd64 \
            --tag "registry.heroku.com/${HEROKU_APP_NAME}/web" \
            .

      - name: Show image information
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: |
          docker image inspect \
            "registry.heroku.com/${HEROKU_APP_NAME}/web" \
            --format='Architecture: {{.Architecture}}, OS: {{.Os}}, Size: {{.Size}} bytes'

      - name: Push image using Skopeo
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          IMAGE="registry.heroku.com/${HEROKU_APP_NAME}/web"

          skopeo copy \
            --retry-times 3 \
            --format v2s2 \
            --dest-compress-format gzip \
            --dest-creds "_:${HEROKU_API_KEY}" \
            "docker-daemon:${IMAGE}" \
            "docker://${IMAGE}"

      - name: Release web container
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: |
          heroku container:release web --app "$HEROKU_APP_NAME"
