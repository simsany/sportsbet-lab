name: Deploy ProphitBet to Heroku

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heroku-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Validate Heroku configuration
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          if [ -z "$HEROKU_APP_NAME" ]; then
            echo "::error::Missing HEROKU_APP_NAME repository variable."
            exit 1
          fi

          if [ -z "$HEROKU_API_KEY" ]; then
            echo "::error::Missing HEROKU_API_KEY repository secret."
            exit 1
          fi

          echo "Target Heroku app: $HEROKU_APP_NAME"

      - name: Log in to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: heroku container:login

      - name: Build Docker image
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
          DOCKER_BUILDKIT: "0"
        run: |
          docker build \
            --pull \
            --platform linux/amd64 \
            --tag "registry.heroku.com/${HEROKU_APP_NAME}/web" \
            .

      - name: Show image information
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: |
          docker image inspect \
            "registry.heroku.com/${HEROKU_APP_NAME}/web" \
            --format='Architecture: {{.Architecture}}, OS: {{.Os}}, Size: {{.Size}} bytes'

      - name: Push image with retries
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        shell: bash
        run: |
          set -Eeuo pipefail

          IMAGE="registry.heroku.com/${HEROKU_APP_NAME}/web"
          MAX_ATTEMPTS=6

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Docker push attempt ${attempt}/${MAX_ATTEMPTS}"

            if docker push "$IMAGE"; then
              echo "Docker image pushed successfully."
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              delay=$((attempt * 30))
              echo "Push failed. Retrying in ${delay} seconds..."
              sleep "$delay"
            fi
          done

          echo "::error::Docker push failed after ${MAX_ATTEMPTS} attempts."
          exit 1

      - name: Release web container
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: |
          heroku container:release web --app "$HEROKU_APP_NAME"
