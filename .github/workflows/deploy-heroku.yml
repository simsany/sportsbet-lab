name: Deploy ProphitBet to Heroku

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heroku-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Log in to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: heroku container:login

      - name: Build and push Docker image
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: |
          test -n "$HEROKU_APP_NAME" || {
            echo "Missing GitHub Actions variable HEROKU_APP_NAME"
            exit 1
          }
          docker build --pull -t "registry.heroku.com/${HEROKU_APP_NAME}/web" .
          docker push "registry.heroku.com/${HEROKU_APP_NAME}/web"

      - name: Release web container
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: heroku container:release web --app "$HEROKU_APP_NAME"
