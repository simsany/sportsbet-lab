name: Deploy ProphitBet Web to Heroku

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heroku-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          test -n "$HEROKU_API_KEY" || { echo "::error::Missing HEROKU_API_KEY GitHub secret"; exit 1; }
          test -n "$HEROKU_APP_NAME" || { echo "::error::Missing HEROKU_APP_NAME GitHub secret"; exit 1; }

      - name: Login to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build and push web image
        env:
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          IMAGE="registry.heroku.com/${HEROKU_APP_NAME}/web"
          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Release web process
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          curl --fail --silent --show-error https://cli-assets.heroku.com/install.sh | sh
          heroku container:release web --app "$HEROKU_APP_NAME"
